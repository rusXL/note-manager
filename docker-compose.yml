version: "3.9"

services:
  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      DB_HOST: sql_db
      DB_PORT: 3306
      DB_USER: note_manager
      DB_PASSWORD: root
      DB_NAME: note_manager
      MONGO_URI: mongodb://mongo_db:27017
      MONGO_DB_NAME: note_manager
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      sql_db:
        condition: service_healthy
      mongo_db:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
    depends_on:
      - api

  sql_db:
    image: mariadb:10.5
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: note_manager
      MYSQL_USER: note_manager
      MYSQL_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo_db:
    image: mongo:6.0
    ports:
      - "27017:27017"
